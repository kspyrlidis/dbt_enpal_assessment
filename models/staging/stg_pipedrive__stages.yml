version: 2

models:
  - name: stg_pipedrive__stages
    description: >
      Staging model for Pipedrive stages. A stage is a logical component of a pipeline, and essentially a bucket that
      can hold a number of deals. One row per stage, with source columns renamed and the surrogate key `table_uuid` added.
    columns:
      - name: table_uuid
        description: '{{ doc("table_uuid") }}'
        data_tests:
          - unique
          - not_null

      - name: stage_id
        description: '{{ doc("pipedrive__stage_id") }}'
        data_tests:
          - not_null

      - name: stage_name
        description: '{{ doc("pipedrive__stage_name") }}'

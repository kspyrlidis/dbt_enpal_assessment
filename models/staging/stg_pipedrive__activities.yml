version: 2

models:
  - name: stg_pipedrive__activities
    description: >
      Staging model for Pipedrive activities. Activities are appointments, tasks and events on a calendar
      that can be associated with a deal, a lead, a person and an organization. One row per activity
      and deal, with source columns renamed and the surrogate key `table_uuid` added.
    columns:
      - name: table_uuid
        description: '{{ doc("table_uuid") }}'
        data_tests:
          - unique
          - not_null

      - name: activity_id
        description: '{{ doc("pipedrive__activity_id") }}'
        data_tests:
          - not_null

      - name: deal_id
        description: '{{ doc("pipedrive__deal_id") }}'
        data_tests:
          - not_null

      - name: activity_type
        description: '{{ doc("pipedrive__activity_type") }}'

      - name: assigned_user_id
        description: '{{ doc("pipedrive__assigned_user_id") }}'

      - name: is_done
        description: '{{ doc("pipedrive__is_done") }}'

      - name: due_timestamp
        description: '{{ doc("pipedrive__due_timestamp") }}'
